version: '3.8'

services:
  db:
    image: postgres:15
    container_name: connect_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: connect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: connect_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: connect_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/connect_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:stable-alpine
    container_name: connect_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
