name: connect_app
description: "A new Flutter project for Corporate Connect"
publish_to: 'none'

version: 2.1.0+2005

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  sqflite_sqlcipher: ^3.1.1
  path: ^1.8.3
  crypto: ^3.0.3
  encrypt: ^5.0.3
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  http: ^1.1.0
  dio: ^5.4.0
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  camera: ^0.11.0
  video_player: ^2.9.0
  chewie: ^1.7.1
  flutter_image_compress: ^2.3.0
  photo_view: ^0.15.0
  bip39: ^1.0.6
  convert: ^3.1.2
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  ota_update: ^7.1.0
  google_fonts: ^6.1.0
  flutter_native_splash: ^2.4.0
  record: ^5.1.2
  audioplayers: ^5.2.1
  agora_rtc_engine: ^6.3.0
  cached_network_image: ^3.4.1
  cryptography: ^2.5.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.1.1
  flutter_secure_storage: ^9.0.0
  flutter_webrtc: ^0.12.3
  package_info_plus: ^8.0.0
  simple_pip_mode: ^1.0.0
  web_socket_channel: ^2.4.0
  flutter_animate: ^4.5.2
  lottie: ^3.1.0
  flutter_callkit_incoming: ^2.0.2
  connectivity_plus: ^6.0.3
  uuid: ^4.5.3
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
dependency_overrides:
  record_linux: 1.3.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_native_splash:
  color: "#040301"
  image: assets/images/logo_emini.png
  android_12:
    image: assets/images/logo_emini_splash_12.png
    color: "#040301"
  fullscreen: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_emini.png"
  min_sdk_android: 21